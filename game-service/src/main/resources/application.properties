spring.application.name=game-service
server.port=8084
logging.level.org.springframework.web=DEBUG
spring.main.web-application-type=reactive
server.netty.connection-timeout= 5000ms

spring.profiles.active=in-memory

# 부하 테스트용 서버 측 송신 계측(ThroughputRecorder + /internal/metrics/throughput) on/off
metrics.throughput.enabled=true

# durable 커맨드 로그 저장소 — 프로파일과 직교. noop(기본): 로그 경로 무비용 통과, in-memory: 개발/테스트용, postgres: 실물
game.log.store=noop

# 방 단위 writer 배치 — 크기/주기가 곧 유실 창
#game.log.batch.max-size=64
#game.log.batch.flush-interval=20ms
# cross-room 배치 (opt-in) — 로그/스냅샷 각각 독립 축, shard 수는 공유
#game.log.batch.cross-room=true
#game.log.batch.snapshot-cross-room=true
#game.log.batch.writer-shards=8

# 방 소유권 lease + fencing token — noop(기본): lease 경로 무비용 통과, postgres: game.log.store=postgres 전제(같은 DB 재사용)
game.lease.store=noop
#game.lease.duration=15s
#game.lease.heartbeat-interval=5s
# 턴 deadline(크로스 프로세스 타이머 복원값) conflate flush 주기
#game.lease.deadline-flush-interval=20ms

# 만료 lease 인수 스캔 — lease·log 둘 다 postgres일 때만 동작. 0 이하 = 루프 비활성
#game.recovery.scan-interval=5s

# game.log.store=postgres일 때만 사용
#game.log.postgres.url=r2dbc:postgresql://localhost:5432/gostop
#game.log.postgres.username=gostop
#game.log.postgres.password=gostop
#game.log.postgres.pool-initial-size=2
#game.log.postgres.pool-max-size=10
#game.log.postgres.init-schema=true

#logging.level.root=OFF